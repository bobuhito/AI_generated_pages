<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef1f4">
<title>Square Dice — Transparent Box Physics</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #eef1f4;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body { position: fixed; inset: 0; }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
    cursor: default;
  }
  #motionPermission {
    position: fixed;
    left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 2;
    display: none;
    border: 1px solid rgba(37, 48, 59, .14);
    border-radius: 999px;
    padding: 10px 16px;
    color: #25303b;
    background: rgba(255,255,255,.94);
    box-shadow: 0 4px 18px rgba(25,35,45,.12);
    font: 600 14px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #motionPermission.visible { display: block; }
  #motionPermission:focus-visible { outline: 2px solid #557da8; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Two square dice moving under gravity. Tap or push them to change their motion."></canvas>
<button id="motionPermission" type="button">Enable motion</button>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const permissionButton = document.getElementById('motionPermission');
  const TAU = Math.PI * 2;
  const params = new URLSearchParams(location.search);
  const readInteger = (name, fallback, min, max) => {
    const raw = params.get(name);
    if (raw === null || !/^-?\d+$/.test(raw)) return fallback;
    const value = Number(raw);
    return Number.isSafeInteger(value) ? Math.min(max, Math.max(min, value)) : fallback;
  };
  const readFloat = (name, fallback, min, max) => {
    const raw = params.get(name);
    if (raw === null || raw.trim() === '') return fallback;
    const value = Number(raw);
    return Number.isFinite(value) ? Math.min(max, Math.max(min, value)) : fallback;
  };

  // All distances are CSS pixels. These options can be changed without editing
  // the file: ?scale=400&size=104&wall=0.82&bounce=0.82&friction=0.36
  const GRAVITY_SCALE = readInteger('scale', 400, 0, 50000); // CSS pixels per meter
  const REQUESTED_DIE_SIZE = readInteger('size', 104, 24, 1000); // CSS pixels
  const WALL_RESTITUTION = readFloat('wall', 0.82, 0, 1);
  const DIE_RESTITUTION = readFloat('bounce', 0.82, 0, 1);
  const CONTACT_FRICTION = readFloat('friction', 0.36, 0, 2);

  const DEFAULT_GRAVITY = { x: 0, y: 9.81 };
  const MAX_SENSOR_ACCELERATION = 16 * 9.81; // reject implausible sensor spikes only
  const MAX_FRAME_TIME = 0.05;
  const MAX_STEP_TIME = 1 / 120;
  const MIN_STEPS_PER_FRAME = 2; // at least two physics steps per rendered frame
  const MAX_TRAVEL_PER_STEP = 0.28; // also subdivide fast linear or angular motion
  const POSITION_ITERATIONS = 3;
  const VELOCITY_ITERATIONS = 3;
  const COUPLED_VELOCITY_ITERATIONS = 10;
  const POSITION_SLOP = 0.12;
  const POSITION_CORRECTION = 0.68;
  const WALL_CONTACT_SLOP = 0.2;
  const WALL_SUPPORT_TOLERANCE = 1.2;
  const CORNER_SEGMENTS = 3;
  const WALLS = [
    { axis: 0, sign: -1, limit: 'zero', normal: { x: 1, y: 0 } },
    { axis: 0, sign: 1, limit: 'width', normal: { x: -1, y: 0 } },
    { axis: 1, sign: -1, limit: 'zero', normal: { x: 0, y: 1 } },
    { axis: 1, sign: 1, limit: 'height', normal: { x: 0, y: -1 } }
  ];

  let width = 1;
  let height = 1;
  let pixelRatio = 1;
  let dieSize = 72;
  let dieRadius = 9;
  let localShape = [];
  let worldPolyBuffers = [[], []];
  let satAxisBuffer = [];
  let dice = [];
  let lastFrameTime = 0;
  let sensorSeen = false;
  let lastSensorTime = -Infinity;
  // Specific-force sample transformed into screen coordinates (m/s²).
  // Its sign is chosen so a phone acceleration pushes the dice oppositely.
  let sensorInstant = { x: 0, y: 9.81 };
  let gravityNow = { x: 0, y: GRAVITY_SCALE * 9.81 };
  let activePointer = null;
  let motionPermissionPending = false;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const dot = (a, b) => a.x * b.x + a.y * b.y;
  const cross = (a, b) => a.x * b.y - a.y * b.x;
  const length = v => Math.hypot(v.x, v.y);
  const normalize = v => {
    const m = length(v);
    return m > 1e-9 ? { x: v.x / m, y: v.y / m } : { x: 1, y: 0 };
  };
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const mul = (v, s) => ({ x: v.x * s, y: v.y * s });
  const rotate = (p, a) => {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
  };

  function makeRoundedSquare(half, radius, segments) {
    const core = half - radius;
    const corners = [
      { x: core, y: -core, start: -Math.PI / 2 },
      { x: core, y: core, start: 0 },
      { x: -core, y: core, start: Math.PI / 2 },
      { x: -core, y: -core, start: Math.PI }
    ];
    const points = [];
    for (const corner of corners) {
      for (let i = 0; i <= segments; i++) {
        const a = corner.start + (Math.PI / 2) * i / segments;
        points.push({
          x: corner.x + Math.cos(a) * radius,
          y: corner.y + Math.sin(a) * radius
        });
      }
    }
    return points;
  }

  function makeDie(x, y, angle, vx, vy, omega, id) {
    const mass = 1;
    const inertia = mass * dieSize * dieSize / 6;
    return {
      id, x, y, angle, vx, vy, omega,
      mass, invMass: 1 / mass,
      inertia, invInertia: 1 / inertia,
      touching: false,
      colorSeed: id === 0 ? 0 : 1
    };
  }

  function resize() {
    const oldW = width, oldH = height;
    width = Math.max(1, window.innerWidth);
    height = Math.max(1, window.innerHeight);
    pixelRatio = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

    const oldSize = dieSize;
    // Size is an exact CSS-pixel setting, capped only to keep each die inside
    // the available viewport even when a very large URL value is supplied.
    dieSize = clamp(REQUESTED_DIE_SIZE, 24, Math.min(1000, Math.min(width, height) * 0.44));
    dieRadius = dieSize * 0.135;
    localShape = makeRoundedSquare(dieSize / 2, dieRadius, CORNER_SEGMENTS);
    worldPolyBuffers = [localShape.map(() => ({ x: 0, y: 0 })), localShape.map(() => ({ x: 0, y: 0 }))];
    satAxisBuffer = [];

    if (!dice.length) {
      const separation = dieSize * 1.18; // keep the enlarged starting dice from overlapping
      dice = [
        makeDie(width * 0.5 - separation * 0.5, height * 0.22, -0.36, 45, -12, 1.55, 0),
        makeDie(width * 0.5 + separation * 0.5, height * 0.31, 0.48, -32, 8, -1.25, 1)
      ];
    } else {
      const sx = oldW > 1 ? width / oldW : 1;
      const sy = oldH > 1 ? height / oldH : 1;
      const scale = oldSize > 0 ? dieSize / oldSize : 1;
      for (const d of dice) {
        d.x *= sx; d.y *= sy;
        d.x = clamp(d.x, dieSize * 0.55, width - dieSize * 0.55);
        d.y = clamp(d.y, dieSize * 0.55, height - dieSize * 0.55);
        d.vx *= scale; d.vy *= scale;
        d.inertia = d.mass * dieSize * dieSize / 6;
        d.invInertia = 1 / d.inertia;
      }
    }
  }

  function worldVertices(body, output = null) {
    const c = Math.cos(body.angle), s = Math.sin(body.angle);
    const vertices = output || localShape.map(() => ({ x: 0, y: 0 }));
    for (let i = 0; i < localShape.length; i++) {
      const p = localShape[i], out = vertices[i];
      out.x = body.x + p.x * c - p.y * s;
      out.y = body.y + p.x * s + p.y * c;
    }
    return vertices;
  }

  function bestFace(points, targetNormal) {
    let bestIndex = 0, bestScore = -Infinity;
    for (let i = 0; i < points.length; i++) {
      const a = points[i], b = points[(i + 1) % points.length];
      const dx = b.x - a.x, dy = b.y - a.y;
      const invLength = 1 / Math.max(1e-9, Math.hypot(dx, dy));
      const score = (dy * invLength) * targetNormal.x + (-dx * invLength) * targetNormal.y;
      if (score > bestScore) { bestScore = score; bestIndex = i; }
    }
    return { index: bestIndex, score: bestScore };
  }

  function clipSegment(points, nx, ny, offset) {
    if (points.length < 2) return points;
    const a = points[0], b = points[1];
    const da = nx * a.x + ny * a.y - offset;
    const db = nx * b.x + ny * b.y - offset;
    if (da <= 0 && db <= 0) return [a, b];
    if (da > 0 && db > 0) return [];
    const t = da / (da - db);
    const hit = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    return da > 0 ? [hit, b] : [a, hit];
  }

  function contactManifold(polyA, polyB, normal) {
    const faceA = bestFace(polyA, normal);
    const faceB = bestFace(polyB, { x: -normal.x, y: -normal.y });
    const referenceIsA = faceA.score >= faceB.score;
    const ref = referenceIsA ? polyA : polyB;
    const inc = referenceIsA ? polyB : polyA;
    const nx = referenceIsA ? normal.x : -normal.x;
    const ny = referenceIsA ? normal.y : -normal.y;
    const refFace = referenceIsA ? faceA : faceB;
    const ref1 = ref[refFace.index];
    const ref2 = ref[(refFace.index + 1) % ref.length];
    const ex = ref2.x - ref1.x, ey = ref2.y - ref1.y;
    const edgeLength = Math.max(1e-9, Math.hypot(ex, ey));
    const tx = ex / edgeLength, ty = ey / edgeLength;
    const incFace = bestFace(inc, { x: -nx, y: -ny });
    let clipped = [inc[incFace.index], inc[(incFace.index + 1) % inc.length]];
    clipped = clipSegment(clipped, -tx, -ty, -(tx * ref1.x + ty * ref1.y));
    clipped = clipSegment(clipped, tx, ty, tx * ref2.x + ty * ref2.y);

    const contacts = [];
    for (const p of clipped) {
      const separation = nx * (p.x - ref1.x) + ny * (p.y - ref1.y);
      if (separation <= 0.75) {
        const contact = { x: p.x - nx * separation * 0.5, y: p.y - ny * separation * 0.5 };
        if (!contacts.length || Math.hypot(contact.x - contacts[0].x, contact.y - contacts[0].y) > 0.5) {
          contacts.push(contact);
        }
      }
    }
    if (contacts.length) return contacts;

    // Rounded-corner/vertex fallback: use one support-point midpoint.
    let maxA = -Infinity, minB = Infinity;
    for (const p of polyA) maxA = Math.max(maxA, p.x * normal.x + p.y * normal.y);
    for (const p of polyB) minB = Math.min(minB, p.x * normal.x + p.y * normal.y);
    let ax = 0, ay = 0, ac = 0, bx = 0, by = 0, bc = 0;
    for (const p of polyA) {
      if (maxA - (p.x * normal.x + p.y * normal.y) <= 0.8) { ax += p.x; ay += p.y; ac++; }
    }
    for (const p of polyB) {
      if ((p.x * normal.x + p.y * normal.y) - minB <= 0.8) { bx += p.x; by += p.y; bc++; }
    }
    if (!ac || !bc) return [{ x: (polyA[0].x + polyB[0].x) * 0.5, y: (polyA[0].y + polyB[0].y) * 0.5 }];
    return [{ x: (ax / ac + bx / bc) * 0.5, y: (ay / ac + by / bc) * 0.5 }];
  }

  function buildSatAxes(polyA, polyB, output = []) {
    let index = 0;
    for (const poly of [polyA, polyB]) {
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i], q = poly[(i + 1) % poly.length];
        const dx = q.x - p.x, dy = q.y - p.y;
        const invLength = 1 / Math.max(1e-9, Math.hypot(dx, dy));
        const axis = output[index] || (output[index] = { x: 0, y: 0 });
        axis.x = dy * invLength;
        axis.y = -dx * invLength;
        index++;
      }
    }
    output.length = index;
    return output;
  }

  function satTest(a, b, polyA, polyB, axes, includeContacts) {
    let minOverlap = Infinity, bestX = 1, bestY = 0;
    const centerX = b.x - a.x, centerY = b.y - a.y;
    for (const axis of axes) {
      const nx = axis.x, ny = axis.y;
      let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
      for (const p of polyA) {
        const projection = p.x * nx + p.y * ny;
        if (projection < minA) minA = projection;
        if (projection > maxA) maxA = projection;
      }
      for (const p of polyB) {
        const projection = p.x * nx + p.y * ny;
        if (projection < minB) minB = projection;
        if (projection > maxB) maxB = projection;
      }
      const overlap = Math.min(maxA, maxB) - Math.max(minA, minB);
      if (overlap <= 0) return null;
      if (overlap < minOverlap) { minOverlap = overlap; bestX = nx; bestY = ny; }
    }
    if (centerX * bestX + centerY * bestY < 0) { bestX = -bestX; bestY = -bestY; }
    const result = { normal: { x: bestX, y: bestY }, penetration: minOverlap };
    if (includeContacts) result.contacts = contactManifold(polyA, polyB, result.normal);
    return result;
  }

  function shiftVertices(vertices, dx, dy) {
    for (const p of vertices) { p.x += dx; p.y += dy; }
  }

  function wallLimit(side) {
    return side.limit === 'width' ? width : side.limit === 'height' ? height : 0;
  }

  function wallExtreme(vertices, side) {
    let extreme = side.sign < 0 ? Infinity : -Infinity;
    if (side.axis === 0) {
      for (const p of vertices) extreme = side.sign < 0 ? Math.min(extreme, p.x) : Math.max(extreme, p.x);
    } else {
      for (const p of vertices) extreme = side.sign < 0 ? Math.min(extreme, p.y) : Math.max(extreme, p.y);
    }
    return extreme;
  }

  function pairMayOverlap(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    // Each square fits inside a circle of radius size / sqrt(2).
    return dx * dx + dy * dy < 2 * dieSize * dieSize;
  }

  function correctPairPosition(a, b, polyA, polyB, axes) {
    if (!pairMayOverlap(a, b)) return false;
    const collision = satTest(a, b, polyA, polyB, axes, false);
    if (!collision) return false;
    const invMassSum = a.invMass + b.invMass;
    const amount = Math.max(collision.penetration - POSITION_SLOP, 0) * POSITION_CORRECTION / invMassSum;
    if (amount <= 0) return false;
    const dax = -collision.normal.x * amount * a.invMass;
    const day = -collision.normal.y * amount * a.invMass;
    const dbx = collision.normal.x * amount * b.invMass;
    const dby = collision.normal.y * amount * b.invMass;
    a.x += dax; a.y += day;
    b.x += dbx; b.y += dby;
    shiftVertices(polyA, dax, day);
    shiftVertices(polyB, dbx, dby);
    a.touching = b.touching = true;
    return true;
  }

  function correctWallPositions(body, vertices, exact = false) {
    let moved = false;
    for (const side of WALLS) {
      const extreme = wallExtreme(vertices, side);
      const limit = wallLimit(side);
      const penetration = side.sign < 0 ? limit - extreme : extreme - limit;
      if (penetration <= POSITION_SLOP) continue;
      const correction = (penetration - POSITION_SLOP) * (exact ? 1 : POSITION_CORRECTION);
      const dx = side.normal.x * correction, dy = side.normal.y * correction;
      body.x += dx; body.y += dy;
      shiftVertices(vertices, dx, dy);
      body.touching = true;
      moved = true;
    }
    return moved;
  }

  function velocityAtOffset(body, rx, ry) {
    if (!body) return { x: 0, y: 0 };
    return { x: body.vx - body.omega * ry, y: body.vy + body.omega * rx };
  }

  function crossOffset(rx, ry, x, y) { return rx * y - ry * x; }

  function makeContactConstraint(bodyA, bodyB, normal, points, restitution) {
    const nx = normal.x, ny = normal.y;
    const tx = -ny, ty = nx;
    const invMassA = bodyA ? bodyA.invMass : 0;
    const invMassB = bodyB ? bodyB.invMass : 0;
    const invInertiaA = bodyA ? bodyA.invInertia : 0;
    const invInertiaB = bodyB ? bodyB.invInertia : 0;
    const contacts = [];
    for (let pointIndex = 0, pointCount = Math.min(2, points.length); pointIndex < pointCount; pointIndex++) {
      const point = points[pointIndex];
      const ra = bodyA ? { x: point.x - bodyA.x, y: point.y - bodyA.y } : { x: 0, y: 0 };
      const rb = bodyB ? { x: point.x - bodyB.x, y: point.y - bodyB.y } : { x: 0, y: 0 };
      const va = velocityAtOffset(bodyA, ra.x, ra.y);
      const vb = velocityAtOffset(bodyB, rb.x, rb.y);
      const initialNormalSpeed = (vb.x - va.x) * nx + (vb.y - va.y) * ny;
      contacts.push({
        point, ra, rb,
        targetNormalSpeed: initialNormalSpeed < -34 ? -restitution * initialNormalSpeed : 0,
        normalImpulse: 0,
        tangentImpulse: 0
      });
    }
    if (contacts.length === 2 && Math.hypot(contacts[0].point.x - contacts[1].point.x,
      contacts[0].point.y - contacts[1].point.y) < dieSize * 0.12) {
      contacts[0].point = {
        x: (contacts[0].point.x + contacts[1].point.x) * 0.5,
        y: (contacts[0].point.y + contacts[1].point.y) * 0.5
      };
      contacts.length = 1;
    }
    if (!contacts.length) return null;

    const kNormal = (c0, c1) => {
      const ra0 = crossOffset(c0.ra.x, c0.ra.y, nx, ny);
      const ra1 = crossOffset(c1.ra.x, c1.ra.y, nx, ny);
      const rb0 = crossOffset(c0.rb.x, c0.rb.y, nx, ny);
      const rb1 = crossOffset(c1.rb.x, c1.rb.y, nx, ny);
      return invMassA + invMassB + invInertiaA * ra0 * ra1 + invInertiaB * rb0 * rb1;
    };
    const k00 = kNormal(contacts[0], contacts[0]);
    const k11 = contacts.length === 2 ? kNormal(contacts[1], contacts[1]) : 0;
    const k01 = contacts.length === 2 ? kNormal(contacts[0], contacts[1]) : 0;
    for (const c of contacts) {
      const raT = crossOffset(c.ra.x, c.ra.y, tx, ty);
      const rbT = crossOffset(c.rb.x, c.rb.y, tx, ty);
      c.tangentMass = 1 / Math.max(1e-9,
        invMassA + invMassB + invInertiaA * raT * raT + invInertiaB * rbT * rbT);
    }
    return {
      bodyA, bodyB, nx, ny, tx, ty, contacts,
      invMassA, invMassB, invInertiaA, invInertiaB,
      k00, k01, k11, friction: CONTACT_FRICTION
    };
  }

  function relativeSpeed(constraint, contact, nx, ny) {
    const a = constraint.bodyA, b = constraint.bodyB;
    const avx = a ? a.vx - a.omega * contact.ra.y : 0;
    const avy = a ? a.vy + a.omega * contact.ra.x : 0;
    const bvx = b ? b.vx - b.omega * contact.rb.y : 0;
    const bvy = b ? b.vy + b.omega * contact.rb.x : 0;
    return (bvx - avx) * nx + (bvy - avy) * ny;
  }

  function applyConstraintImpulse(constraint, contact, nx, ny, magnitude) {
    if (magnitude === 0) return;
    const ix = nx * magnitude, iy = ny * magnitude;
    const a = constraint.bodyA, b = constraint.bodyB;
    if (a) {
      a.vx -= ix * a.invMass;
      a.vy -= iy * a.invMass;
      a.omega -= crossOffset(contact.ra.x, contact.ra.y, ix, iy) * a.invInertia;
    }
    if (b) {
      b.vx += ix * b.invMass;
      b.vy += iy * b.invMass;
      b.omega += crossOffset(contact.rb.x, contact.rb.y, ix, iy) * b.invInertia;
    }
  }

  function solveTwoContactLCP(q0, q1, k00, k01, k11) {
    const eps = 1e-7;
    const determinant = k00 * k11 - k01 * k01;
    if (determinant > 1e-10) {
      const x = (-q0 * k11 + q1 * k01) / determinant;
      const y = (-q1 * k00 + q0 * k01) / determinant;
      if (x >= -eps && y >= -eps) return [Math.max(0, x), Math.max(0, y)];
    }
    const only0 = -q0 / Math.max(k00, 1e-9);
    if (only0 >= -eps && q1 + k01 * only0 >= -eps) return [Math.max(0, only0), 0];
    const only1 = -q1 / Math.max(k11, 1e-9);
    if (only1 >= -eps && q0 + k01 * only1 >= -eps) return [0, Math.max(0, only1)];
    if (q0 >= -eps && q1 >= -eps) return [0, 0];

    // Degenerate contact geometry: projected-gradient fallback. The shared
    // spectral step avoids the oscillation of independent Jacobi updates.
    const largestEigenvalue = 0.5 * (k00 + k11 + Math.hypot(k00 - k11, 2 * k01));
    const step = 1 / Math.max(largestEigenvalue, 1e-9);
    let x = 0, y = 0;
    for (let i = 0; i < 24; i++) {
      const rx = q0 + k00 * x + k01 * y;
      const ry = q1 + k01 * x + k11 * y;
      x = Math.max(0, x - step * rx);
      y = Math.max(0, y - step * ry);
    }
    return [x, y];
  }

  function solveNormalBlock(constraint) {
    const contacts = constraint.contacts;
    const c0 = contacts[0];
    const vn0 = relativeSpeed(constraint, c0, constraint.nx, constraint.ny);
    if (contacts.length === 1) {
      const next = Math.max(0, c0.normalImpulse +
        (c0.targetNormalSpeed - vn0) / Math.max(constraint.k00, 1e-9));
      const delta = next - c0.normalImpulse;
      c0.normalImpulse = next;
      applyConstraintImpulse(constraint, c0, constraint.nx, constraint.ny, delta);
      return;
    }

    const c1 = contacts[1];
    const vn1 = relativeSpeed(constraint, c1, constraint.nx, constraint.ny);
    const old0 = c0.normalImpulse, old1 = c1.normalImpulse;
    const q0 = vn0 - c0.targetNormalSpeed - constraint.k00 * old0 - constraint.k01 * old1;
    const q1 = vn1 - c1.targetNormalSpeed - constraint.k01 * old0 - constraint.k11 * old1;
    const next = solveTwoContactLCP(q0, q1, constraint.k00, constraint.k01, constraint.k11);
    const d0 = next[0] - old0, d1 = next[1] - old1;
    c0.normalImpulse = next[0];
    c1.normalImpulse = next[1];
    // Both deltas are determined from the same pre-application velocity state.
    applyConstraintImpulse(constraint, c0, constraint.nx, constraint.ny, d0);
    applyConstraintImpulse(constraint, c1, constraint.nx, constraint.ny, d1);
  }

  function solveFrictionBlock(constraint) {
    const contacts = constraint.contacts;
    const c0 = contacts[0];
    const limit0 = constraint.friction * c0.normalImpulse;
    const next0 = clamp(c0.tangentImpulse -
      relativeSpeed(constraint, c0, constraint.tx, constraint.ty) * c0.tangentMass,
      -limit0, limit0);
    const delta0 = next0 - c0.tangentImpulse;
    c0.tangentImpulse = next0;

    let c1 = null, delta1 = 0;
    if (contacts.length === 2) {
      c1 = contacts[1];
      const limit1 = constraint.friction * c1.normalImpulse;
      const next1 = clamp(c1.tangentImpulse -
        relativeSpeed(constraint, c1, constraint.tx, constraint.ty) * c1.tangentMass,
        -limit1, limit1);
      delta1 = next1 - c1.tangentImpulse;
      c1.tangentImpulse = next1;
    }

    // Both tangential changes are computed before either is applied.
    applyConstraintImpulse(constraint, c0, constraint.tx, constraint.ty, delta0);
    if (c1) applyConstraintImpulse(constraint, c1, constraint.tx, constraint.ty, delta1);
  }

  function makeWallConstraint(body, vertices, side) {
    const extreme = wallExtreme(vertices, side);
    const limit = wallLimit(side);
    const penetration = side.sign < 0 ? limit - extreme : extreme - limit;
    if (penetration < -WALL_CONTACT_SLOP) return null;

    // Select the two ends of a genuine supporting edge. For a rounded-corner
    // contact the support patch is short, so retain just the extreme vertex.
    let first = null, last = null, firstT = Infinity, lastT = -Infinity;
    let extremePoint = null;
    for (const p of vertices) {
      const value = side.axis === 0 ? p.x : p.y;
      const tangent = side.axis === 0 ? p.y : p.x;
      if (!extremePoint || (side.sign < 0 ? value < (side.axis === 0 ? extremePoint.x : extremePoint.y)
        : value > (side.axis === 0 ? extremePoint.x : extremePoint.y))) extremePoint = p;
      if (Math.abs(value - extreme) <= WALL_SUPPORT_TOLERANCE) {
        if (tangent < firstT) { firstT = tangent; first = p; }
        if (tangent > lastT) { lastT = tangent; last = p; }
      }
    }

    const projectToWall = p => side.axis === 0
      ? { x: limit, y: p.y }
      : { x: p.x, y: limit };
    let points;
    if (first && last && lastT - firstT >= dieSize * 0.28) {
      points = [projectToWall(first), projectToWall(last)];
    } else {
      points = [projectToWall(extremePoint)];
    }
    body.touching = true;
    return makeContactConstraint(null, body, side.normal, points, WALL_RESTITUTION);
  }

  function physicsStep(dt) {
    for (const body of dice) {
      body.touching = false;
      body.vx += gravityNow.x * dt;
      body.vy += gravityNow.y * dt;
      body.x += body.vx * dt;
      body.y += body.vy * dt;
      body.angle = (body.angle + body.omega * dt) % TAU;
    }

    // Rotation is fixed during split positional correction, so SAT axes remain
    // valid while the cached vertices are translated after each correction.
    const polyA = worldVertices(dice[0], worldPolyBuffers[0]);
    const polyB = worldVertices(dice[1], worldPolyBuffers[1]);
    const axes = buildSatAxes(polyA, polyB, satAxisBuffer);

    // Stage 1: position stabilization. Pair correction comes first; wall
    // correction comes last on every pass so a pair cannot leave a die inside
    // the screen boundary.
    for (let iteration = 0; iteration < POSITION_ITERATIONS; iteration++) {
      const pairMoved = correctPairPosition(dice[0], dice[1], polyA, polyB, axes);
      const wallMovedA = correctWallPositions(dice[0], polyA);
      const wallMovedB = correctWallPositions(dice[1], polyB);
      if (!pairMoved && !wallMovedA && !wallMovedB) break;
    }
    // Finish with an exact wall projection: pair correction must never leave
    // either die visibly embedded in the screen boundary.
    correctWallPositions(dice[0], polyA, true);
    correctWallPositions(dice[1], polyB, true);

    // Stage 2: build each final contact manifold exactly once.
    const pairCollision = pairMayOverlap(dice[0], dice[1])
      ? satTest(dice[0], dice[1], polyA, polyB, axes, true)
      : null;
    const pairConstraint = pairCollision
      ? makeContactConstraint(dice[0], dice[1], pairCollision.normal, pairCollision.contacts, DIE_RESTITUTION)
      : null;
    const wallConstraints = [];
    for (const body of dice) {
      for (const side of WALLS) {
        const constraint = makeWallConstraint(body, body === dice[0] ? polyA : polyB, side);
        if (constraint) wallConstraints.push(constraint);
      }
    }

    // Stage 3: velocity resolution. Each manifold uses simultaneous two-point
    // normal impulses and accumulated Coulomb friction. Its geometry and mass
    // matrix are reused throughout these iterations.
    if (pairConstraint || wallConstraints.length) {
      let wallContactsA = 0, wallContactsB = 0;
      for (const constraint of wallConstraints) {
        if (constraint.bodyB === dice[0]) wallContactsA++;
        else if (constraint.bodyB === dice[1]) wallContactsB++;
      }
      // A pair constraint coupled to a wall, or two walls supporting the same
      // die, forms a small contact island. Give those connected constraints
      // extra inexpensive passes so stacked dice settle without residual drift.
      const coupled = (pairConstraint && wallConstraints.length) || wallContactsA > 1 || wallContactsB > 1;
      const iterationCount = coupled ? COUPLED_VELOCITY_ITERATIONS : VELOCITY_ITERATIONS;
      for (let iteration = 0; iteration < iterationCount; iteration++) {
        if (pairConstraint) {
          solveNormalBlock(pairConstraint);
          solveFrictionBlock(pairConstraint);
        }
        // Walls follow the pair so the final velocity pass cannot leave a body
        // moving into a wall after the pair impulse has been resolved.
        for (const constraint of wallConstraints) {
          solveNormalBlock(constraint);
          solveFrictionBlock(constraint);
        }
      }
    }
  }

  function updateGravity(now) {
    // a_relative = gravity - a_phone = -specific_force.
    // DeviceMotion's x/y axes are right/up in the device's standard frame;
    // on the canvas, x is right and y is down. The sensor handler performs
    // the sign and screen-orientation conversion before storing the sample.
    const fresh = sensorSeen && now - lastSensorTime <= 1200;
    let x = fresh ? sensorInstant.x : DEFAULT_GRAVITY.x;
    let y = fresh ? sensorInstant.y : DEFAULT_GRAVITY.y;

    // Reject only impossible/extreme sensor spikes. There is deliberately no
    // low-pass filter, reduced gain, gravity cap, or die-speed cap.
    const magnitude = Math.hypot(x, y);
    if (magnitude > MAX_SENSOR_ACCELERATION) {
      const factor = MAX_SENSOR_ACCELERATION / magnitude;
      x *= factor; y *= factor;
    }
    gravityNow.x = x * GRAVITY_SCALE;
    gravityNow.y = y * GRAVITY_SCALE;
  }

  function faceUpValue(body) {
    // World-space upward components of the four local sides. Side order is
    // clockwise from the top: 1, 2, 4, 3.
    const c = Math.cos(body.angle), s = Math.sin(body.angle);
    let best = -c, value = 1;
    if (s < best) { best = s; value = 2; }
    if (c < best) { best = c; value = 4; }
    if (-s < best) value = 3;
    return value;
  }

  function drawDie(body) {
    const half = dieSize / 2;
    const radius = dieRadius;
    const c = Math.cos(body.angle), s = Math.sin(body.angle);

    // Draw the body with a simple offset shadow. Avoid canvas shadowBlur,
    // which can be disproportionately expensive on mobile GPUs.
    ctx.save();
    ctx.translate(body.x, body.y);
    ctx.rotate(body.angle);
    ctx.fillStyle = 'rgba(28, 38, 48, .10)';
    ctx.beginPath();
    ctx.roundRect(-half + 1, -half + 2.5, dieSize, dieSize, radius);
    ctx.fill();

    ctx.fillStyle = body.colorSeed ? '#f7f9fb' : '#fffefa';
    ctx.beginPath();
    ctx.roundRect(-half, -half, dieSize, dieSize, radius);
    ctx.fill();
    ctx.lineWidth = Math.max(1.1, dieSize * 0.018);
    ctx.strokeStyle = 'rgba(55, 66, 77, .22)';
    ctx.stroke();
    ctx.lineWidth = Math.max(0.8, dieSize * 0.009);
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.roundRect(-half + 3, -half + 3, dieSize - 6, dieSize - 6, Math.max(3, radius - 2));
    ctx.stroke();
    ctx.restore();

    // Positions rotate with the die, while the markings remain upright.
    // Drawing directly in screen space avoids per-mark save/restore and rotate.
    const markFont = Math.max(9, dieSize * 0.115);
    ctx.fillStyle = 'rgba(91, 103, 115, .68)';
    ctx.font = `600 ${markFont}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const markOffset = half * 0.67;
    ctx.fillText('1', body.x + markOffset * s, body.y - markOffset * c);
    ctx.fillText('2', body.x + markOffset * c, body.y + markOffset * s);
    ctx.fillText('4', body.x - markOffset * s, body.y + markOffset * c);
    ctx.fillText('3', body.x - markOffset * c, body.y - markOffset * s);

    ctx.fillStyle = '#26313b';
    ctx.font = `700 ${dieSize * 0.43}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    ctx.fillText(String(faceUpValue(body)), body.x, body.y + dieSize * 0.015);
  }

  function render() {
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.fillStyle = '#eef1f4';
    ctx.fillRect(0, 0, width, height);
    for (const body of dice) drawDie(body);
  }

  function screenAngle() {
    let angle = 0;
    if (screen.orientation && Number.isFinite(screen.orientation.angle)) angle = screen.orientation.angle;
    else if (Number.isFinite(window.orientation)) angle = window.orientation;
    return ((angle % 360) + 360) % 360;
  }

  function rotateSensorAxesToScreen(x, y) {
    // DeviceMotion's x/y axes are tied to the device's natural coordinate
    // frame. Rotate them into the currently locked screen orientation.
    const angle = screenAngle();
    if (angle === 90) return { x: y, y: -x };
    if (angle === 180) return { x: -x, y: -y };
    if (angle === 270) return { x: -y, y: x };
    return { x, y };
  }

  function onDeviceMotion(event) {
    const a = event && event.accelerationIncludingGravity;
    if (!a || !Number.isFinite(a.x) || !Number.isFinite(a.y)) return;
    const aligned = rotateSensorAxesToScreen(a.x, a.y);
    // At rest, accelerationIncludingGravity points opposite actual gravity.
    // Canvas y increases downward, hence (-x, +y) gives screen-plane gravity.
    // In the DeviceMotion coordinate convention, x is screen-right and y is
    // screen-up. Canvas y points downward. Negating the accelerometer's
    // specific-force vector therefore gives (gravity - phone acceleration)
    // as (-x, +y) in canvas coordinates.
    sensorInstant.x = -aligned.x;
    sensorInstant.y = aligned.y;
    sensorSeen = true;
    lastSensorTime = performance.now();
    updateGravity(lastSensorTime); // take effect on the very next rendered frame
  }

  function showPermissionPrompt() {
    permissionButton.classList.add('visible');
  }

  function hidePermissionPrompt() {
    permissionButton.classList.remove('visible');
  }

  async function requestMotionPermission() {
    if (motionPermissionPending) return;
    motionPermissionPending = true;
    permissionButton.textContent = 'Enabling…';
    try {
      const result = await window.DeviceMotionEvent.requestPermission();
      if (result === 'granted') {
        window.addEventListener('devicemotion', onDeviceMotion, { passive: true });
        hidePermissionPrompt();
      } else {
        permissionButton.textContent = 'Motion unavailable';
      }
    } catch (_) {
      permissionButton.textContent = 'Motion unavailable';
    } finally {
      motionPermissionPending = false;
    }
  }

  function startMotionSensing() {
    if (typeof window.DeviceMotionEvent !== 'undefined' &&
        typeof window.DeviceMotionEvent.requestPermission === 'function') {
      showPermissionPrompt();
      permissionButton.addEventListener('click', requestMotionPermission, { once: true });
    } else {
      window.addEventListener('devicemotion', onDeviceMotion, { passive: true });
    }
  }

  function worldToLocal(body, point) {
    const dx = point.x - body.x, dy = point.y - body.y;
    const c = Math.cos(body.angle), s = Math.sin(body.angle);
    return { x: dx * c + dy * s, y: -dx * s + dy * c };
  }

  function roundedSquareDistanceAndNormal(local) {
    const half = dieSize / 2;
    const core = half - dieRadius;
    const qx = Math.abs(local.x) - core;
    const qy = Math.abs(local.y) - core;
    const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
    let normal;
    const outsideLength = Math.hypot(ox, oy);
    if (outsideLength > 1e-8) {
      normal = {
        x: Math.sign(local.x || 1) * ox / outsideLength,
        y: Math.sign(local.y || 1) * oy / outsideLength
      };
    } else if (qx > qy) {
      normal = { x: Math.sign(local.x || 1), y: 0 };
    } else {
      normal = { x: 0, y: Math.sign(local.y || 1) };
    }
    const distance = outsideLength + Math.min(Math.max(qx, qy), 0) - dieRadius;
    return { distance, normal };
  }

  function surfaceAtPoint(body, point) {
    const local = worldToLocal(body, point);
    const info = roundedSquareDistanceAndNormal(local);
    const boundaryLocal = sub(local, mul(info.normal, info.distance));
    const boundaryOffset = rotate(boundaryLocal, body.angle);
    const worldNormal = rotate(info.normal, body.angle);
    return {
      point: { x: body.x + boundaryOffset.x, y: body.y + boundaryOffset.y },
      normal: worldNormal
    };
  }

  function applyPointerImpulse(body, contact, inwardDirection, speed) {
    const direction = normalize(inwardDirection);
    const impulseMagnitude = body.mass * clamp(speed, 105, 1050);
    const impulse = mul(direction, impulseMagnitude);
    const r = { x: contact.x - body.x, y: contact.y - body.y };
    body.vx += impulse.x * body.invMass;
    body.vy += impulse.y * body.invMass;
    body.omega += cross(r, impulse) * body.invInertia;
  }

  function pointInsideBody(body, point) {
    return roundedSquareDistanceAndNormal(worldToLocal(body, point)).distance <= 0;
  }

  function segmentEntry(body, from, to) {
    const steps = Math.max(8, Math.ceil(length(sub(to, from)) / (dieSize * 0.12)));
    let previousT = 0;
    let wasInside = pointInsideBody(body, from);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const p = { x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t };
      const inside = pointInsideBody(body, p);
      if (inside && !wasInside) {
        let lo = previousT, hi = t;
        for (let j = 0; j < 12; j++) {
          const mid = (lo + hi) * 0.5;
          const q = { x: from.x + (to.x - from.x) * mid, y: from.y + (to.y - from.y) * mid };
          if (pointInsideBody(body, q)) hi = mid; else lo = mid;
        }
        const hit = { x: from.x + (to.x - from.x) * hi, y: from.y + (to.y - from.y) * hi };
        return hit;
      }
      wasInside = inside;
      previousT = t;
    }
    return null;
  }

  function pointerKickAt(body, point, pointerVelocity, isTap) {
    const surface = surfaceAtPoint(body, point);
    const inward = mul(surface.normal, -1);
    let normalSpeed = pointerVelocity ? -dot(pointerVelocity, surface.normal) : 0;
    if (isTap) normalSpeed = 260;
    else if (normalSpeed < 35) return;
    applyPointerImpulse(body, surface.point, inward, isTap ? 260 : Math.max(140, normalSpeed * 0.78));
    body.touching = false;
  }

  function pointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  function onPointerDown(event) {
    if (event.button !== undefined && event.button !== 0) return;
    const p = pointerPosition(event);
    const now = performance.now();
    activePointer = { id: event.pointerId, point: p, time: now };
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
    // A tap is a single localized impulse, never a grab.
    for (let i = dice.length - 1; i >= 0; i--) {
      if (pointInsideBody(dice[i], p)) {
        pointerKickAt(dice[i], p, null, true);
        break;
      }
    }
    event.preventDefault();
  }

  function onPointerMove(event) {
    if (!activePointer || activePointer.id !== event.pointerId) return;
    const p = pointerPosition(event);
    const now = performance.now();
    const elapsed = Math.max(0.008, (now - activePointer.time) / 1000);
    const delta = sub(p, activePointer.point);
    const pointerVelocity = mul(delta, 1 / elapsed);
    for (const body of dice) {
      const hit = segmentEntry(body, activePointer.point, p);
      if (hit) pointerKickAt(body, hit, pointerVelocity, false);
    }
    activePointer.point = p;
    activePointer.time = now;
    event.preventDefault();
  }

  function endPointer(event) {
    if (activePointer && (event.pointerId === undefined || activePointer.id === event.pointerId)) {
      activePointer = null;
    }
  }

  function animate(time) {
    if (!lastFrameTime) lastFrameTime = time;
    const elapsed = Math.min(MAX_FRAME_TIME, Math.max(0, (time - lastFrameTime) / 1000));
    lastFrameTime = time;

    if (elapsed > 0) {
      updateGravity(time);
      let maxPointSpeed = 0;
      for (const body of dice) {
        // Include rotational tip speed so a rapidly spinning die also gets
        // enough substeps to keep corner collisions stable.
        const pointSpeed = Math.hypot(body.vx, body.vy) + Math.abs(body.omega) * dieSize * Math.SQRT1_2;
        if (pointSpeed > maxPointSpeed) maxPointSpeed = pointSpeed;
      }
      const acceleration = Math.hypot(gravityNow.x, gravityNow.y);
      const estimatedTravel = maxPointSpeed * elapsed + 0.5 * acceleration * elapsed * elapsed;
      const distanceStep = Math.max(8, dieSize * MAX_TRAVEL_PER_STEP);
      // At least two steps per rendered frame, and never larger than 1/120 s.
      // Thus the physics rate is max(2 × display FPS, 120 Hz), with extra
      // adaptive steps only when linear or angular travel requires them.
      const steps = Math.max(
        MIN_STEPS_PER_FRAME,
        Math.ceil(elapsed / MAX_STEP_TIME),
        Math.ceil(estimatedTravel / distanceStep)
      );
      const step = elapsed / steps;
      for (let i = 0; i < steps; i++) physicsStep(step);
    }

    render();
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', () => {
    setTimeout(resize, 120);
  }, { passive: true });
  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', endPointer, { passive: true });
  window.addEventListener('pointercancel', endPointer, { passive: true });
  window.addEventListener('blur', () => { activePointer = null; }, { passive: true });

  resize();
  startMotionSensing();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
